[pytest]
# The default Windows %TEMP%\pytest-of-<user> directory can end up with
# locked/permission-denied stale entries (observed after background pip
# installs). Use a project-local temp root instead so tmp_path fixtures
# are reliable in this environment.
addopts = --basetemp=.pytest_tmp
# Scope discovery to the real test suite so a bare `pytest` doesn't also
# try to collect the throwaway/experimental scripts under research/.
testpaths = app/tests
markers =
    slow: exercises real Demucs/GPU inference; downloads model weights on first run
