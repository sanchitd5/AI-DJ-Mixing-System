name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: System packages (ffmpeg for the set-clip tests)
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends ffmpeg libsndfile1

      - name: Python dependencies
        run: python -m pip install -r requirements-ci.txt

      - name: Console JS checks
        run: |
          fail=0
          for f in app/tests/js/*_check.js; do
            node "$f" > /dev/null || { echo "FAIL $f"; fail=1; }
          done
          exit $fail

      - name: pytest (not slow)
        run: python -m pytest app/tests/ -q -m "not slow" --ignore=app/tests/py/test_ui_server.py
